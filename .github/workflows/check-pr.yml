
name: 📌 Check PR

on:
  workflow_dispatch:
  # Automatic triggers removed; invoke through FounderOS/Admin Gate.
permissions:
    pull-requests: read

jobs:
    validate:
        name: validate PR title
        runs-on: ubuntu-latest

        steps:
            - uses: amannn/action-semantic-pull-request@v5
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              with:
                  subjectPattern: ^(?![A-Z]).+$
